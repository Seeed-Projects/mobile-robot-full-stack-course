<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="590" viewBox="0 0 1240 590"><rect width="100%" height="100%" fill="#ffffff" /><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#65758a" /></marker></defs><text x="34" y="51" fill="#203247" font-family="DejaVu Sans, sans-serif" font-size="27" text-anchor="start">6.1 | Map -&gt; save -&gt; relocalize -&gt; navigate</text><text x="34" y="80" fill="#65758a" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="start">Keep mapping and localization mutually exclusive</text><polyline points="265,185.0 340,185.0" fill="none" stroke="#65758a" stroke-width="3" marker-end="url(#arrow)" /><polyline points="570,185.0 650,185.0" fill="none" stroke="#65758a" stroke-width="3" marker-end="url(#arrow)" /><polyline points="890,185.0 965,185.0" fill="none" stroke="#65758a" stroke-width="3" marker-end="url(#arrow)" /><polyline points="1082.5,225 1082.5,355" fill="none" stroke="#65758a" stroke-width="3" marker-end="url(#arrow)" /><polyline points="965,397.5 890,397.5" fill="none" stroke="#65758a" stroke-width="3" marker-end="url(#arrow)" /><polyline points="650,397.5 590,397.5" fill="none" stroke="#65758a" stroke-width="3" marker-end="url(#arrow)" /><polyline points="340,397.5 265,397.5" fill="none" stroke="#65758a" stroke-width="3" marker-end="url(#arrow)" /><text x="302.5" y="383.5" fill="#65758a" font-family="DejaVu Sans, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="middle">pass</text><rect x="35" y="145" width="230" height="80" rx="12" fill="#e7effa" stroke="#4674a5" stroke-width="2" /><text x="150.0" y="172.5" fill="#203247" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="middle" dominant-baseline="middle">Start mapping</text><text x="150.0" y="197.5" fill="#203247" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="middle">run_mapping.sh</text><rect x="340" y="145" width="230" height="80" rx="12" fill="#e4f3ef" stroke="#25856c" stroke-width="2" /><text x="455.0" y="172.5" fill="#203247" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="middle" dominant-baseline="middle">Survey / loop closure</text><text x="455.0" y="197.5" fill="#203247" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="middle">live scan + EKF</text><rect x="650" y="145" width="240" height="80" rx="12" fill="#e7effa" stroke="#4674a5" stroke-width="2" /><text x="770.0" y="172.5" fill="#203247" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="middle" dominant-baseline="middle">Save observed map</text><text x="770.0" y="197.5" fill="#203247" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="middle">pgm + yaml + pose graph</text><rect x="965" y="145" width="235" height="80" rx="12" fill="#eef1f5" stroke="#647487" stroke-width="2" /><text x="1082.5" y="172.5" fill="#203247" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="middle" dominant-baseline="middle">Stop mapping</text><text x="1082.5" y="197.5" fill="#203247" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="middle">Ctrl+C terminal A</text><rect x="35" y="355" width="230" height="85" rx="12" fill="#fff2d9" stroke="#bb8430" stroke-width="2" /><text x="150.0" y="385.0" fill="#203247" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="middle" dominant-baseline="middle">Navigate</text><text x="150.0" y="410.0" fill="#203247" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="middle">Nav2 active</text><rect x="340" y="355" width="250" height="85" rx="12" fill="#e4f3ef" stroke="#25856c" stroke-width="2" /><text x="465.0" y="385.0" fill="#203247" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="middle" dominant-baseline="middle">Check localization</text><text x="465.0" y="410.0" fill="#203247" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="middle">5 AMCL updates + scan fit</text><rect x="650" y="355" width="240" height="85" rx="12" fill="#e7effa" stroke="#4674a5" stroke-width="2" /><text x="770.0" y="385.0" fill="#203247" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="middle" dominant-baseline="middle">Seed / rotate</text><text x="770.0" y="410.0" fill="#203247" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="middle">relocalize --pose ...</text><rect x="965" y="355" width="235" height="85" rx="12" fill="#e7effa" stroke="#4674a5" stroke-width="2" /><text x="1082.5" y="385.0" fill="#203247" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="middle" dominant-baseline="middle">Reload saved map</text><text x="1082.5" y="410.0" fill="#203247" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="middle">run_navigation.sh</text><text x="34" y="568" fill="#65758a" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="start">If localization fails: inspect map / TF / scan / seed; keep navigation inactive.</text></svg>