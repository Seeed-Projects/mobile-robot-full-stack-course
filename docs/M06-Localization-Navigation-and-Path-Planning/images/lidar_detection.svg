<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="590" viewBox="0 0 1240 590"><rect width="100%" height="100%" fill="#ffffff" /><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#65758a" /></marker></defs><text x="34" y="51" fill="#203247" font-family="DejaVu Sans, sans-serif" font-size="27" text-anchor="start">6.3 | LiDAR obstacle detection pipeline</text><text x="34" y="80" fill="#65758a" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="start">Geometric detection is implemented; persistent tracking / prediction are extensions</text><polyline points="235,180.0 300,180.0" fill="none" stroke="#65758a" stroke-width="3" marker-end="url(#arrow)" /><polyline points="520,180.0 590,180.0" fill="none" stroke="#65758a" stroke-width="3" marker-end="url(#arrow)" /><polyline points="810,180.0 915,180.0" fill="none" stroke="#65758a" stroke-width="3" marker-end="url(#arrow)" /><polyline points="1050.0,220 1050.0,350" fill="none" stroke="#65758a" stroke-width="3" marker-end="url(#arrow)" /><text x="1050.0" y="271.0" fill="#65758a" font-family="DejaVu Sans, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="middle">clusters</text><polyline points="410.0,220 410.0,350" fill="none" stroke="#65758a" stroke-width="3" marker-end="url(#arrow)" /><text x="410.0" y="271.0" fill="#65758a" font-family="DejaVu Sans, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="middle">projection</text><polyline points="520,392.5 590,392.5" fill="none" stroke="#65758a" stroke-width="3" marker-end="url(#arrow)" /><text x="555.0" y="378.5" fill="#65758a" font-family="DejaVu Sans, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="middle">clear</text><polyline points="985,220 985,275 700,275 700,350" fill="none" stroke="#65758a" stroke-width="3" marker-end="url(#arrow)" /><text x="700" y="261" fill="#65758a" font-family="DejaVu Sans, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="middle">mark</text><rect x="35" y="140" width="200" height="80" rx="12" fill="#e7effa" stroke="#4674a5" stroke-width="2" /><text x="135.0" y="167.5" fill="#203247" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="middle" dominant-baseline="middle">Timestamped cloud</text><text x="135.0" y="192.5" fill="#203247" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="middle">sensor frame -&gt; base</text><rect x="300" y="140" width="220" height="80" rx="12" fill="#e4f3ef" stroke="#25856c" stroke-width="2" /><text x="410.0" y="167.5" fill="#203247" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="middle" dominant-baseline="middle">ROI + voxel grid</text><text x="410.0" y="192.5" fill="#203247" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="middle">invalid / self / range</text><rect x="590" y="140" width="220" height="80" rx="12" fill="#e4f3ef" stroke="#25856c" stroke-width="2" /><text x="700.0" y="167.5" fill="#203247" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="middle" dominant-baseline="middle">Ground RANSAC</text><text x="700.0" y="192.5" fill="#203247" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="middle">near-horizontal plane</text><rect x="915" y="140" width="270" height="80" rx="12" fill="#e4f3ef" stroke="#25856c" stroke-width="2" /><text x="1050.0" y="167.5" fill="#203247" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="middle" dominant-baseline="middle">Obstacle cloud</text><text x="1050.0" y="192.5" fill="#203247" font-family="DejaVu Sans, sans-serif" font-size="14" text-anchor="middle" dominant-baseline="middle">non-ground points</text><rect x="300" y="350" width="220" height="85" rx="12" fill="#e7effa" stroke="#4674a5" stroke-width="2" /><text x="410.0" y="380.0" fill="#203247" font-famil