<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Isaac ROS FoundationPose data flow</title>
  <desc id="desc">RGB-D and camera information join detection and instance mask inputs, then flow through FoundationPose refinement and scoring to Detection3DArray output and tracking.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 z" fill="#334155"/>
    </marker>
    <style>
      .box { stroke: #334155; stroke-width: 2; rx: 12; }
      .input { fill: #e0f2fe; }
      .prep { fill: #fef3c7; }
      .compute { fill: #dcfce7; }
      .output { fill: #fce7f3; }
      .external { fill: #f1f5f9; stroke-dasharray: 8 6; }
      .title { font: 700 26px sans-serif; fill: #0f172a; }
      .label { font: 600 18px sans-serif; fill: #0f172a; }
      .small { font: 14px monospace; fill: #334155; }
      .edge { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 10 8; }
    </style>
  </defs>
  <rect width="1200" height="620" fill="#ffffff"/>
  <text x="600" y="45" text-anchor="middle" class="title">Isaac ROS FoundationPose: RGB-D to 6D pose</text>

  <rect x="40" y="100" width="210" height="120" class="box input"/>
  <text x="145" y="132" text-anchor="middle" class="label">RGB-D camera</text>
  <text x="145" y="164" text-anchor="middle" class="small">image</text>
  <text x="145" y="186" text-anchor="middle" class="small">depth_image</text>
  <text x="145" y="208" text-anchor="middle" class="small">camera_info</text>

  <rect x="40" y="300" width="210" height="120" class="box input"/>
  <text x="145" y="335" text-anchor="middle" class="label">Object detector</text>
  <text x="145" y="370" text-anchor="middle" class="small">RT-DETR / Detection2D</text>
  <text x="145" y="394" text-anchor="middle" class="small">target instance</text>

  <rect x="330" y="300" width="210" height="120" class="box prep"/>
  <text x="435" y="338" text-anchor="middle" class="label">BBox to mask</text>
  <text x="435" y="372" text-anchor="middle" class="small">binary segmentation</text>
  <text x="435" y="396" text-anchor="middle" class="small">segmentation</text>

  <rect x="625" y="170" width="260" height="190" class="box compute"/>
  <text x="755" y="208" text-anchor="middle" class="label">FoundationPose node</text>
  <text x="755" y="246" text-anchor="middle" class="small">global hypotheses</text>
  <text x="755" y="270" text-anchor="middle" class="small">refine TensorRT</text>
  <text x="755" y="294" text-anchor="middle" class="small">score TensorRT</text>
  <text x="755" y="328" text-anchor="middle" class="small">pose_estimation/*</text>

  <rect x="625" y="430" width="260" height="100" class="box compute"/>
  <text x="755" y="468" text-anchor="middle" class="label">Tracking node</text>
  <text x="755" y="500" text-anchor="middle" class="small">previous pose + refine</text>

  <rect x="960" y="180" width="200" height="150" class="box output"/>
  <text x="1060" y="220" text-anchor="middle" class="label">ROS 2 output</text>
  <text x="1060" y="258" text-anchor="middle" class="small">Detection3DArray</text>
  <text x="1060" y="282" text-anchor="middle" class="small">/output (project remap)</text>
  <text x="1060" y="306" text-anchor="middle" class="small">pose + frame_id</text>

  <rect x="945" y="420" width="230" height="100" class="box external"/>
  <text x="1060" y="458" text-anchor="middle" class="label">Robot consumers</text>
  <text x="1060" y="490" text-anchor="middle" class="small">TF / grasp / navigation</text>

  <rect x="350" y="90" width="185" height="100" class="box external"/>
  <text x="442" y="125" text-anchor="middle" class="label">Target assets</text>
  <text x="442" y="157" text-anchor="middle" class="small">mesh + texture</text>

  <path d="M250 160 H625" class="edge"/>
  <path d="M250 360 H330" class="edge"/>
  <path d="M540 360 H625" class="edge"/>
  <path d="M535 140 C580 140 580 230 625 230" class="edge dashed"/>
  <path d="M885 265 H960" class="edge"/>
  <path d="M755 360 V430" class="edge"/>
  <path d="M885 480 H945" class="edge"/>

  <text x="600" y="585" text-anchor="middle" class="small">Course diagram based on Isaac ROS 3.2 FoundationPose launch/API contracts; not a runtime screenshot.</text>
</svg>
