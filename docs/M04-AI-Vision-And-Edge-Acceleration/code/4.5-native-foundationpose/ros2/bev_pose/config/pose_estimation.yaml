# pose_estimation.yaml — shared config for both FoundationPoseNode + ObjectMaskNode.
#
# Topic names are *placeholders*; the launch file overrides them with
# absolute /perception/* paths so we never depend on relative names.
#
# Required at runtime:
#   /perception/cameras/front/image        (sensor_msgs/Image, rgb8 or bgr8)
#   /perception/cameras/front/depth        (sensor_msgs/Image, 32FC1 meters)
#   /perception/cameras/front/camera_info  (sensor_msgs/CameraInfo)
#   /perception/object_mask                (sensor_msgs/Image, mono8 0/255)
#
# Published:
#   /perception/object_pose                (geometry_msgs/PoseStamped)
#   /perception/object_poses_3d            (vision_msgs/Detection3DArray)  [optional]
#   /tf                                    (camera_front → <frame_id>)
#   /perception/mesh_meta                  (std_msgs/String — JSON dump)
#   /perception/foundationpose/stats       (std_msgs/String — JSON dump, 1Hz)

foundationpose_node:
  ros__parameters:
    # The launch file supplies FOUNDATIONPOSE_DIR/weights.
    model_dir: ""
    refiner_iterations: 5
    score_threshold: 0.3
    device: "cuda:0"
    e2e_latency_warn_ms: 200.0
    auto_register_on_first_mask: true
    require_mask_for_register: true
    publish_det3d: true
    publish_tf: true
    publish_debug_image: false
    debug_image_topic: "/perception/foundationpose/pose_image"

    # Topics (overridden by launch file)
    rgb_topic: "/perception/cameras/front/image"
    depth_topic: "/perception/cameras/front/depth"
    camera_info_topic: "/perception/cameras/front/camera_info"
    mask_topic: "/perception/object_mask"
    pose_topic: "/perception/object_pose"
    det3d_topic: "/perception/object_poses_3d"
    score_topic: "/perception/foundationpose/stats"

    # Geometry (overridden by launch file)
    # The launch file supplies paths relative to M4_CODE_ROOT.
    mesh_npz_path: ""
    mesh_obj: ""
    frame_id: "cup"
    camera_frame_id: "camera_front"

object_mask_node:
  ros__parameters:
    min_depth_m: 0.10
    max_depth_m: 1.20
    default_pad_px: 8
    # [-1,-1,-1,-1] = no static ROI; otherwise [x_min,y_min,x_max,y_max]
    static_roi: [-1, -1, -1, -1]
    # 0 = keep running; >0 = publish N masks then shut down (P0 helper).
    auto_stop_after_masks: 0

    # Topics (overridden by launch file)
    depth_topic: "/perception/cameras/front/depth"
    rgb_topic: "/perception/cameras/front/image"
    mask_topic: "/perception/object_mask"
    roi_topic: "/perception/mask_roi_hint"
