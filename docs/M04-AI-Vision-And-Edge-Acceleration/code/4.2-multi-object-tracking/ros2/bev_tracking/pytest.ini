[pytest]
# ROS 2 ament_python expects test files to be auto-discovered with the
# python3-pytest runner. We want pytest to find both:
#   - the pure-python adapter / tracker unit tests
#   - the rclpy-based integration tests
#
# Notes:
#   - python_files restricted to test_*.py so launch_testing does not
#     try to import test/__init__.py as a launch entrypoint.
#   - We disable launch_testing and ament_lint plugins because:
#       * This package is pure-Python and uses pytest for everything.
#       * On this host, launch_testing_ros is incompatible with the
#         system pytest (6.2.5) due to a hook name change in newer
#         pytest, causing INTERNALERROR on collection. Disabling is
#         the official workaround until upstream matches the host.
#   - filterwarnings keeps ByteTrack's "no detection in empty frame"
#     warnings from spamming CI output.
#   - We intentionally do NOT add markers for slow / cuda because this
#     package has neither. The detection agent owns any GPU tests.
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = test
addopts =
    -p no:launch_testing
    -p no:launch_testing_ros_pytest_entrypoint
    -p no:ament_lint
    -p no:ament_copyright
    -p no:ament_pep257
    -p no:ament_flake8
    -p no:ament_xmllint
    --ignore=test/__init__.py
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
