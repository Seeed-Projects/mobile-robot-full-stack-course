ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 50.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom
    # Integrate forward encoder velocity, constrain lateral velocity to zero.
    # Do not fuse the wheel-integrated position/yaw or wheel-derived yaw rate.
    odom0: /wheel/odometry
    odom0_config: [false, false, false,
                   false, false, false,
                   true, true, false,
                   false, false, false,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    imu0: /imu/data
    imu0_config: [false, false, false,
                 false, false, false,
                 false, false, false,
                 false, false, true,
                 false, false, false]
    imu0_queue_size: 20
    imu0_differential: false
    imu0_remove_gravitational_acceleration: false
    print_diagnostics: true
